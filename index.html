<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>BasketBall ScoreBoard</title>
</head>
<body>
        <div class="container">
            <div>
                <h3>HOME</h3>
            </div>
            <div>
                <h3>GUEST</h3>
            </div>

        </div>

        <div class="score">
            <h1 id="home-score">0</h1>  
            <h1 id="guest-score">0</h1>  
        </div>

        <div class="buttons">
            <div>
                <button id="home-add-1" onclick="addhome1()">+1</button>
                <button id="home-add-2" onclick="addhome2()">+2</button>
                <button id="home-add-3" onclick="addhome3()">+3</button>
            </div>
            <div>
                <button id="guest-add-1" onclick="addguest1()">+1</button>
                <button id="guest-add-2" onclick="addguest2()">+2</button>
                <button id="guest-add-3" onclick="addguest3()">+3</button>
            </div>

          
        <script src = "index.js"></script>
    
</body>
</html>
